<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Rooftop Parkour</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070710;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const COLORS = {
      bgTop: '#060714',
      bgBottom: '#130b29',
      cyan: '#00f3ff',
      magenta: '#ff007f',
      purple: '#9d00ff',
      yellow: '#ffe600',
      building: '#0d1021',
      buildingEdge: '#1f2847'
    };

    let gameState = 'MENU';
    let score = 0;
    let highScore = localStorage.getItem('neonParkourHigh') || 0;
    let combo = 1;
    let gameSpeed = 7;
    let frameCount = 0;
    let shakeTime = 0;

    const player = {
      x: 110,
      y: 0,
      w: 32,
      h: 54,
      normalH: 54,
      slideH: 26,
      vy: 0,
      gravity: 0.72,
      jumpPower: -14.5,
      jumpsUsed: 0,
      maxJumps: 2,
      isGrounded: false,
      isSliding: false,
      dashTimer: 0,
      dashCooldown: 0,
      flipAngle: 0,
      trail: []
    };

    let buildings = [];
    let obstacles = [];
    let orbs = [];
    let particles = [];
    let bgStars = [];
    let bgSkyline = [];

    function initBackground() {
      bgStars = [];
      for (let i = 0; i < 60; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.7,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.3 + 0.1
        });
      }
      bgSkyline = [];
      let sx = 0;
      while (sx < width + 300) {
        const bw = 60 + Math.random() * 90;
        const bh = 120 + Math.random() * 220;
        bgSkyline.push({ x: sx, w: bw, h: bh });
        sx += bw + 10;
      }
    }

    function spawnParticles(x, y, color, count, speedScale = 1) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 4 + 1.5) * speedScale;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: Math.random() * 0.03 + 0.02,
          size: Math.random() * 4 + 2,
          color
        });
      }
    }

    function resetGame() {
      score = 0;
      combo = 1;
      gameSpeed = 7.5;
      frameCount = 0;
      buildings = [];
      obstacles = [];
      orbs = [];
      particles = [];

      const startY = height * 0.68;
      buildings.push({
        x: 0,
        y: startY,
        w: width + 400,
        h: height - startY + 100
      });

      player.x = Math.min(130, width * 0.22);
      player.y = startY - player.normalH;
      player.h = player.normalH;
      player.vy = 0;
      player.jumpsUsed = 0;
      player.isGrounded = true;
      player.isSliding = false;
      player.dashTimer = 0;
      player.dashCooldown = 0;
      player.flipAngle = 0;
      player.trail = [];

      generateNextSegments();
    }

    function generateNextSegments() {
      let lastB = buildings[buildings.length - 1];
      while (lastB.x + lastB.w < width + 900) {
        const gap = 110 + Math.random() * (gameSpeed * 11);
        const bw = 320 + Math.random() * 420;
        const deltaY = (Math.random() - 0.48) * 130;
        const minY = height * 0.42;
        const maxY = height * 0.80;
        const by = Math.max(minY, Math.min(maxY, lastB.y + deltaY));

        const newB = {
          x: lastB.x + lastB.w + gap,
          y: by,
          w: bw,
          h: height - by + 100
        };
        buildings.push(newB);

        if (bw > 380 && Math.random() < 0.72) {
          const obsX = newB.x + bw * 0.55;
          if (Math.random() < 0.5) {
            obstacles.push({
              type: 'LASER',
              x: obsX,
              y: newB.y - 68,
              w: 34,
              h: 34
            });
          } else {
            obstacles.push({
              type: 'SPIKE',
              x: obsX,
              y: newB.y - 28,
              w: 32,
              h: 28
            });
          }
        }

        const orbCount = 3 + Math.floor(Math.random() * 3);
        const arcPeak = 75 + Math.random() * 40;
        for (let i = 0; i < orbCount; i++) {
          const t = (i + 1) / (orbCount + 1);
          const ox = lastB.x + lastB.w + gap * t;
          const baseLine = lastB.y + (newB.y - lastB.y) * t;
          const oy = baseLine - 40 - Math.sin(t * Math.PI) * arcPeak;
          orbs.push({ x: ox, y: oy, r: 9, collected: false });
        }

        lastB = newB;
      }
    }

    function triggerJump() {
      if (gameState !== 'PLAYING') return;
      if (player.jumpsUsed < player.maxJumps) {
        player.isSliding = false;
        if (player.h === player.slideH) {
          player.y -= (player.normalH - player.slideH);
          player.h = player.normalH;
        }
        player.vy = player.jumpPower * (player.jumpsUsed === 1 ? 0.92 : 1);
        player.isGrounded = false;
        player.jumpsUsed++;

        if (player.jumpsUsed === 2) {
          player.flipAngle = 0.15;
          spawnParticles(player.x + player.w / 2, player.y + player.h, COLORS.magenta, 14, 1.2);
        } else {
          spawnParticles(player.x + player.w / 2, player.y + player.h, COLORS.cyan, 10, 0.9);
        }
      }
    }

    function triggerRightActionStart() {
      if (gameState !== 'PLAYING') return;
      if (!player.isGrounded && player.dashCooldown <= 0) {
        player.dashTimer = 12;
        player.dashCooldown = 38;
        player.vy = -1.5;
        spawnParticles(player.x, player.y + player.h / 2, COLORS.yellow, 18, 1.5);
      } else {
        player.isSliding = true;
        if (player.isGrounded && player.h !== player.slideH) {
          player.y += (player.normalH - player.slideH);
          player.h = player.slideH;
        }
      }
    }

    function triggerRightActionEnd() {
      player.isSliding = false;
      if (player.h === player.slideH) {
        player.y -= (player.normalH - player.slideH);
        player.h = player.normalH;
      }
    }

    const activeTouches = new Map();

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'MENU' || gameState === 'GAMEOVER') {
        gameState = 'PLAYING';
        resetGame();
        return;
      }
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const side = t.clientX < width * 0.5 ? 'LEFT' : 'RIGHT';
        activeTouches.set(t.identifier, side);
        if (side === 'LEFT') {
          triggerJump();
        } else {
          triggerRightActionStart();
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const side = activeTouches.get(t.identifier);
        activeTouches.delete(t.identifier);
        if (side === 'RIGHT') {
          triggerRightActionEnd();
        }
      }
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      if (gameState === 'MENU' || gameState === 'GAMEOVER') {
        gameState = 'PLAYING';
        resetGame();
        return;
      }
      if (e.clientX < width * 0.5) {
        triggerJump();
      } else {
        triggerRightActionStart();
      }
    });

    canvas.addEventListener('mouseup', () => {
      triggerRightActionEnd();
    });

    window.addEventListener('keydown', (e) => {
      if (gameState !== 'PLAYING' && (e.code === 'Space' || e.code === 'ArrowUp')) {
        gameState = 'PLAYING';
        resetGame();
        return;
      }
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') triggerJump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'ShiftLeft') triggerRightActionStart();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'ShiftLeft') triggerRightActionEnd();
    });

    function endGame() {
      gameState = 'GAMEOVER';
      shakeTime = 16;
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, COLORS.magenta, 35, 1.8);
      if (Math.floor(score) > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem('neonParkourHigh', highScore);
      }
    }

    function update() {
      frameCount++;

      for (const s of bgStars) {
        s.x -= s.speed;
        if (s.x < 0) s.x = width;
      }
      for (const b of bgSkyline) {
        b.x -= (gameState === 'PLAYING' ? gameSpeed * 0.2 : 0.6);
        if (b.x + b.w < 0) {
          b.x = width + 40;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (shakeTime > 0) shakeTime--;
      if (gameState !== 'PLAYING') return;

      gameSpeed = Math.min(16.5, 7.5 + score * 0.0018);
      const currentSpeed = player.dashTimer > 0 ? gameSpeed * 1.75 : gameSpeed;
      score += currentSpeed * 0.045 * combo;

      if (player.dashTimer > 0) player.dashTimer--;
      if (player.dashCooldown > 0) player.dashCooldown--;

      const prevBottom = player.y + player.h;

      if (player.dashTimer <= 0) {
        player.vy += player.gravity;
        player.y += player.vy;
      }

      if (player.flipAngle > 0 && !player.isGrounded) {
        player.flipAngle += 0.26;
        if (player.flipAngle >= Math.PI * 2) player.flipAngle = 0;
      } else {
        player.flipAngle = 0;
      }

      player.isGrounded = false;
      for (const b of buildings) {
        b.x -= currentSpeed;

        const withinX = player.x + player.w - 6 > b.x && player.x + 6 < b.x + b.w;
        const currBottom = player.y + player.h;

        if (withinX && player.vy >= 0 && prevBottom <= b.y + 16 && currBottom >= b.y) {
          player.y = b.y - player.h;
          player.vy = 0;
          player.isGrounded = true;
          player.jumpsUsed = 0;

          if (player.isSliding && player.h !== player.slideH) {
            player.y += (player.normalH - player.slideH);
            player.h = player.slideH;
          }
        } else if (
          player.x + player.w > b.x + 4 &&
          player.x < b.x + 20 &&
          player.y + player.h > b.y + 14
        ) {
          if (player.vy > 0) {
            player.vy = player.jumpPower * 0.85;
            player.jumpsUsed = 1;
            combo = Math.min(5, combo + 1);
            spawnParticles(player.x + player.w, player.y + player.h / 2, COLORS.yellow, 14, 1.3);
          }
        }
      }

      for (const obs of obstacles) {
        obs.x -= currentSpeed;
        const hitX = player.x + 6 < obs.x + obs.w - 4 && player.x + player.w - 6 > obs.x + 4;
        const hitY = player.y + 4 < obs.y + obs.h - 4 && player.y + player.h - 4 > obs.y + 4;

        if (hitX && hitY) {
          if (player.dashTimer > 0) {
            obs.x = -500;
            score += 50 * combo;
            combo = Math.min(5, combo + 1);
            shakeTime = 6;
            spawnParticles(player.x + player.w, player.y + player.h / 2, COLORS.yellow, 20, 1.6);
          } else {
            endGame();
            return;
          }
        }
      }

      for (const orb of orbs) {
        orb.x -= currentSpeed;
        if (!orb.collected) {
          const dx = (player.x + player.w / 2) - orb.x;
          const dy = (player.y + player.h / 2) - orb.y;
          if (Math.hypot(dx, dy) < orb.r + 24) {
            orb.collected = true;
            score += 25 * combo;
            combo = Math.min(5, combo + 1);
            spawnParticles(orb.x, orb.y, COLORS.cyan, 10, 1.1);
          }
        }
      }

      buildings = buildings.filter(b => b.x + b.w > -100);
      obstacles = obstacles.filter(o => o.x + o.w > -100);
      orbs = orbs.filter(o => o.x + o.r > -100 && !o.collected);
      generateNextSegments();

      if (frameCount % 2 === 0) {
        player.trail.push({
          x: player.x,
          y: player.y,
          w: player.w,
          h: player.h,
          color: player.dashTimer > 0 ? COLORS.yellow : (player.jumpsUsed === 2 ? COLORS.magenta : COLORS.cyan),
          alpha: 0.55
        });
      }
      for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].x -= currentSpeed * 0.5;
        player.trail[i].alpha -= 0.06;
        if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
      }

      if (player.y > height + 60) {
        endGame();
      }
    }

    function draw() {
      ctx.save();
      if (shakeTime > 0) {
        const dx = (Math.random() - 0.5) * 10;
        const dy = (Math.random() - 0.5) * 10;
        ctx.translate(dx, dy);
      }

      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, COLORS.bgTop);
      bgGrad.addColorStop(1, COLORS.bgBottom);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#ffffff';
      for (const s of bgStars) {
        ctx.globalAlpha = 0.5;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }
      ctx.globalAlpha = 1;

      for (const b of bgSkyline) {
        ctx.fillStyle = '#0b0e20';
        ctx.fillRect(b.x, height - b.h, b.w, b.h);
        ctx.strokeStyle = '#181e3d';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x, height - b.h, b.w, b.h);
      }

      for (const b of buildings) {
        ctx.fillStyle = COLORS.building;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        ctx.strokeStyle = COLORS.cyan;
        ctx.lineWidth = 3;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(b.x + b.w, b.y);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = COLORS.buildingEdge;
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }

      for (const orb of orbs) {
        ctx.save();
        ctx.fillStyle = COLORS.cyan;
        ctx.shadowColor = COLORS.cyan;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const obs of obstacles) {
        ctx.save();
        if (obs.type === 'LASER') {
          ctx.fillStyle = COLORS.magenta;
          ctx.shadowColor = COLORS.magenta;
          ctx.shadowBlur = 14;
          ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(obs.x + 8, obs.y + 8, obs.w - 16, obs.h - 16);
        } else {
          ctx.fillStyle = COLORS.magenta;
          ctx.shadowColor = COLORS.magenta;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(obs.x, obs.y + obs.h);
          ctx.lineTo(obs.x + obs.w / 2, obs.y);
          ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      for (const t of player.trail) {
        ctx.save();
        ctx.globalAlpha = t.alpha;
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.restore();
      }

      if (gameState === 'PLAYING' || gameState === 'MENU') {
        ctx.save();
        const cx = player.x + player.w / 2;
        const cy = player.y + player.h / 2;
        ctx.translate(cx, cy);
        ctx.rotate(player.flipAngle);

        const pColor = player.dashTimer > 0 ? COLORS.yellow : COLORS.cyan;
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = pColor;
        ctx.lineWidth = 3;
        ctx.shadowColor = pColor;
        ctx.shadowBlur = 14;

        ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);
        ctx.strokeRect(-player.w / 2, -player.h / 2, player.w, player.h);

        ctx.fillStyle = COLORS.magenta;
        ctx.fillRect(2, -player.h / 2 + 8, player.w / 2 - 4, 8);
        ctx.restore();
      }

      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
      }

      if (gameState === 'PLAYING') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${Math.floor(score)}`, 24, 42);

        ctx.fillStyle = COLORS.yellow;
        ctx.font = 'bold 18px system-ui, sans-serif';
        ctx.fillText(`COMBO x${combo}`, 24, 68);

        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.font = '13px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('TAP LEFT: JUMP / DOUBLE JUMP', width * 0.25, height - 18);
        ctx.fillText('HOLD RIGHT: SLIDE  |  AIR TAP: DASH', width * 0.75, height - 18);
      }

      if (gameState === 'MENU') {
        drawOverlay(
          'NEON ROOFTOP PARKOUR',
          'LEFT SIDE: Tap to Jump (2x for Flip)   •   RIGHT SIDE: Hold to Slide / Mid-Air Tap to Dash',
          'TAP ANYWHERE TO RUN'
        );
      } else if (gameState === 'GAMEOVER') {
        drawOverlay(
          'WIPEOUT!',
          `SCORE: ${Math.floor(score)}   •   BEST: ${highScore}`,
          'TAP ANYWHERE TO TRY AGAIN'
        );
      }

      ctx.restore();
    }

    function drawOverlay(title, subtitle, actionText) {
      ctx.fillStyle = 'rgba(6, 7, 20, 0.75)';
      ctx.fillRect(0, 0, width, height);

      ctx.textAlign = 'center';
      ctx.fillStyle = COLORS.cyan;
      ctx.shadowColor = COLORS.cyan;
      ctx.shadowBlur = 18;
      ctx.font = '900 38px system-ui, sans-serif';
      ctx.fillText(title, width / 2, height * 0.40);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText(subtitle, width / 2, height * 0.49);

      const pulse = 0.7 + Math.sin(frameCount * 0.08) * 0.3;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = COLORS.magenta;
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillText(actionText, width / 2, height * 0.60);
      ctx.globalAlpha = 1;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initBackground();
    resetGame();
    loop();
  </script>
</body>
</html>
